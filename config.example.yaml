telegram:
  token: ${GITGRAM_TELEGRAM_TOKEN}
  chat_id: -1001234567890             # or several: -1001234567890, -1009876543210 (the first gets the forum topics)
  mode: webhook                 # webhook | polling
  webhook_secret: ${GITGRAM_TG_WEBHOOK_SECRET:-}   # required in webhook mode; unused with --poll
  threads:                      # forum topic ids; omit → General
    pipeline: 42
    default: 44
server:
  listen: ":8080"
  public_base_url: https://hooks.example.com
  gitlab_webhook_path: /webhook/gitlab
  telegram_webhook_path: /webhook/telegram
gitlab:
  base_url: https://gitlab.com
  group: my-org                 # top-level group; all projects under it (subgroups included) are accepted
  read_token: ${GITGRAM_GITLAB_TOKEN:-}       # optional, read_api; enables diff stats, failure logs, artifacts, force-push detection, reconciler
  hooks_token: ${GITGRAM_GITLAB_HOOKS_TOKEN:-} # optional, api scope; `gitgram sync-hooks` and the card operations (stop, retry, play, run)
  webhook_secret: ${GITGRAM_WEBHOOK_SECRET}
storage: { path: /data/gitgram.db }
logging: { level: info, format: text }
defaults:
  events: [push, pipeline]
  verbosity: normal
  branches: { allow: ["*"], deny: ["renovate/*"] }
  pipelines: { child_cards: inline, quiet_success: true, log_tail: { lines: 10 } }
  push: { max_commits: 10 }
projects:                       # optional per-project overrides, matched by path
  - path: my-org/backend
    verbosity: verbose
    threads: { pipeline: 50 }
    branches: { allow: ["main", "release/*"] }
  - path: my-org/infra
    events: [pipeline]
users:                          # gitlab username → telegram user id
  emi: 123456789
