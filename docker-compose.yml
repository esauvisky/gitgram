services:
  gitgram:
    image: ghcr.io/esauvisky/gitgram:${VERSION:-latest}
    build:                      # only used by `docker compose up --build`; otherwise the image is pulled
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    read_only: true
    environment:
      GITGRAM_TELEGRAM_TOKEN: ${GITGRAM_TELEGRAM_TOKEN:?required}
      GITGRAM_TG_WEBHOOK_SECRET: ${GITGRAM_TG_WEBHOOK_SECRET:?required}
      GITGRAM_GITLAB_TOKEN: ${GITGRAM_GITLAB_TOKEN:-}
      GITGRAM_GITLAB_HOOKS_TOKEN: ${GITGRAM_GITLAB_HOOKS_TOKEN:-}
      GITGRAM_WEBHOOK_SECRET: ${GITGRAM_WEBHOOK_SECRET:?required}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - data:/data
    ports:
      - "8080:8080"

volumes:
  data:
