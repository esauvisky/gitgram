services:
  gitgram:
    image: ghcr.io/esauvisky/gitgram:${VERSION:-latest}
    build:                      # only used by `docker compose up --build`; otherwise the image is pulled
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    read_only: true
    env_file: .env              # every setting; see .env.example
    volumes:
      - data:/data
    ports:
      - "8080:8080"

volumes:
  data:
